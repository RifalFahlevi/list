<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Sortir & Pendataan Buku</title>
  
  <!-- Library Scan Universal Compatible Semua Device (HTML5-QRCode) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { padding: 20px; background-color: #f4f7f6; max-width: 650px; margin: auto; }
    h2 { color: #333; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; }
    .input-row { display: flex; gap: 10px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; }
    .input-id { flex: 1; }
    .input-judul { flex: 2; }
    button { background-color: #28a745; color: white; border: none; padding: 11px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #6c757d; cursor: not-allowed; }
    .btn-sync { background-color: #17a2b8; margin-bottom: 10px; width: 100%; }
    .btn-scan { background-color: #007bff; margin-bottom: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-scan:hover { background-color: #0056b3; }
    .status-msg { font-size: 13px; margin-top: -5px; font-weight: 500; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #343a40; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* Container Area Kamera */
    #reader-container { display: none; margin-bottom: 15px; border: 2px dashed #007bff; padding: 10px; border-radius: 8px; background: #fff; text-align: center; }
    #reader { width: 100%; max-width: 450px; margin: auto; overflow: hidden; border-radius: 6px; }
    .scan-box-info { font-size: 12px; color: #555; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <h2>SORTIR DULU GUYSSS</h2>

  <div class="card">
    <button type="button" class="btn-sync" onclick="fetchData(true)">🔄 Sync Master Data Terbaru</button>
    <button type="button" class="btn-scan" onclick="toggleScanner()">📷 <span id="btnScanText">Buka Kamera Scan Barcode</span></button>
    
    <!-- Area Scanner Kamera -->
    <div id="reader-container">
      <div id="reader"></div>
      <p class="scan-box-info" id="scannerHint">Tahan kamera dengan tenang. Posisikan barcode tepat di dalam <b>kotak hijau/merah</b></p>
    </div>

    <form id="bookForm" class="form-group">
      <div class="input-row">
        <input type="text" id="inputId" class="input-id" placeholder="Ketik/Scan ID Buku" required oninput="cariJudulOtomatis()" autofocus>
        <input type="text" id="inputJudul" class="input-judul" placeholder="Judul Buku (Otomatis)" readonly>
      </div>
      <div id="statusMsg" class="status-msg"></div>
      <button type="submit" id="btnSimpan" disabled>Simpan Ke List</button>
    </form>
  </div>

  <div class="card">
    <div class="controls">
      <label><strong>Urutkan Berdasarkan:</strong></label>
      <select id="sortBy" onchange="renderTable()">
        <option value="id-desc">Terbaru Disimpan</option>
        <option value="judul-asc">Judul (A - Z)</option>
        <option value="judul-desc">Judul (Z - A)</option>
        <option value="id-asc">ID (A - Z)</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 35%;">ID Buku</th>
          <th>Judul Buku</th>
        </tr>
      </thead>
      <tbody id="bookTableBody">
        <tr><td colspan="2" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwvND8_BwNxiygXN14reHZbHGk6oHctBVQsgeu5DkpH7-0jxyqLOY0G79NVhVcl_qh2_w/exec";

    let masterMap = new Map();
    let listBukuSimpan = [];
    let html5QrCode = null;
    let isScanning = false;

    document.addEventListener("DOMContentLoaded", () => {
      loadLocalMaster();
      fetchData(false);
    });

    function loadLocalMaster() {
      const cachedMaster = localStorage.getItem("masterBukuCache");
      if (cachedMaster) {
        const arr = JSON.parse(cachedMaster);
        masterMap = new Map(arr.map(item => [cleanID(item.id), item.judul]));
      }
    }

    // Fungsi normalisasi ID (menghapus spasi & titik agar pencocokan 100% akurat)
    function cleanID(idStr) {
      if (!idStr) return "";
      return String(idStr).replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    }

    function fetchData(forceReload = false) {
      const statusMsg = document.getElementById("statusMsg");
      if (forceReload) statusMsg.textContent = "Sedang sinkronisasi data master...";

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data.master && data.master.length > 0) {
            localStorage.setItem("masterBukuCache", JSON.stringify(data.master));
            masterMap = new Map(data.master.map(item => [cleanID(item.id), item.judul]));
          }
          
          listBukuSimpan = data.simpan || [];
          renderTable();

          if (forceReload) {
            statusMsg.style.color = "#28a745";
            statusMsg.textContent = "✓ Master data berhasil diperbarui!";
            setTimeout(() => statusMsg.textContent = "", 2000);
          }
        })
        .catch(err => console.error("Error load data:", err));
    }

    // --- SCANNER SMOOTH & COMPATIBLE UNTUK ALL DEVICES (iOS & ANDROID) ---
    function toggleScanner() {
      const container = document.getElementById("reader-container");
      const btnText = document.getElementById("btnScanText");

      if (isScanning) {
        if (html5QrCode) {
          html5QrCode.stop().then(() => {
            html5QrCode.clear();
            container.style.display = "none";
            btnText.textContent = "Buka Kamera Scan Barcode";
            isScanning = false;
          }).catch(err => console.error(err));
        }
      } else {
        container.style.display = "block";
        btnText.textContent = "Tutup Kamera";
        isScanning = true;
        startUniversalScanner();
      }
    }

    function startUniversalScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const formatsToSupport = [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_39
      ];

      // KONFIGURASI SCAN TELITI & SMOOTH
      const config = {
        fps: 6, // Diperlambat ke 6 FPS agar tidak menyambar barcode secara acak
        qrbox: { width: 280, height: 160 }, // Persegi panjang fokus melintang
        formatsToSupport: formatsToSupport,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).catch(err => {
        alert("Gagal membuka kamera: " + err + ". Pastikan izin kamera aktif!");
        toggleScanner();
      });
    }

    let detectHistory = [];
    
    function onScanSuccess(decodedText) {
      const rawCode = decodedText.trim();
      const cleanedCode = cleanID(rawCode);

      if (!cleanedCode) return;

      const hint = document.getElementById("scannerHint");

      // CEK KE DATABASE MASTER
      if (masterMap.has(cleanedCode)) {
        
        // BUFFER TELITI: Harus terdeteksi 2 kali berturut-turut dengan ID yang sama
        detectHistory.push(cleanedCode);
        if (detectHistory.length > 2) detectHistory.shift();

        if (detectHistory.length === 2 && detectHistory[0] === detectHistory[1]) {
          detectHistory = [];
          
          const inputId = document.getElementById("inputId");
          inputId.value = rawCode;

          cariJudulOtomatis();
          toggleScanner(); // Tutup kamera jika sudah teliti ketemu di database
        } else {
          hint.style.color = "#28a745";
          hint.innerHTML = `⏳ <b>Buku terdeteksi!</b> Tahan HP sebentar dengan tenang...`;
        }

      } else {
        // Jika barcode di-scan TIDAK ADA di database, tampilkan status & tetap buka kamera
        detectHistory = [];
        hint.style.color = "#dc3545";
        hint.innerHTML = `✕ Barcode <b>${rawCode}</b> tidak ada di database. Arahkan ke barcode buku yang tepat!`;
      }
    }

    // --- PENCARIAN INSTAN ---
    function cariJudulOtomatis() {
      const rawInput = document.getElementById("inputId").value.trim();
      const cleanedInput = cleanID(rawInput);
      const inputJudul = document.getElementById("inputJudul");
      const btnSimpan = document.getElementById("btnSimpan");
      const statusMsg = document.getElementById("statusMsg");

      if (cleanedInput === "") {
        inputJudul.value = "";
        statusMsg.textContent = "";
        btnSimpan.disabled = true;
        return;
      }

      if (masterMap.has(cleanedInput)) {
        inputJudul.value = masterMap.get(cleanedInput);
        statusMsg.style.color = "#28a745";
        statusMsg.textContent = "✓ Buku ditemukan!";
        btnSimpan.disabled = false;
      } else {
        inputJudul.value = "";
        statusMsg.style.color = "#dc3545";
        statusMsg.textContent = "✕ ID Buku tidak ditemukan di database";
        btnSimpan.disabled = true;
      }
    }

    // --- SIMPAN INSTAN ---
    document.getElementById("bookForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const idVal = document.getElementById("inputId").value.trim();
      const judulVal = document.getElementById("inputJudul").value;

      const dataBaru = { id: idVal, judul: judulVal };

      listBukuSimpan.unshift(dataBaru);
      renderTable();

      document.getElementById("inputId").value = "";
      document.getElementById("inputJudul").value = "";
      document.getElementById("statusMsg").textContent = "";
      document.getElementById("btnSimpan").disabled = true;
      document.getElementById("inputId").focus();

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(dataBaru)
      }).catch(err => console.error("Gagal simpan ke cloud:", err));
    });

    // --- RENDER TABEL ---
    function renderTable() {
      const sortBy = document.getElementById("sortBy").value;
      const tbody = document.getElementById("bookTableBody");

      let sortedData = [...listBukuSimpan];

      sortedData.sort((a, b) => {
        if (sortBy === "judul-asc") return String(a.judul).localeCompare(String(b.judul));
        if (sortBy === "judul-desc") return String(b.judul).localeCompare(String(a.judul));
        if (sortBy === "id-asc") return String(a.id).localeCompare(String(b.id));
        if (sortBy === "id-desc") return 0;
      });

      tbody.innerHTML = "";
      if (sortedData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;">Belum ada buku yang disimpan.</td></tr>';
        return;
      }

      sortedData.forEach(book => {
        tbody.innerHTML += `
          <tr>
            <td><code>${book.id}</code></td>
            <td><strong>${book.judul}</strong></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
